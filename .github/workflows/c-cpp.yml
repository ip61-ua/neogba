name: neogba test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Downloading project.
        uses: actions/checkout@v4

      - name: Instaling dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-14 libgtest-dev libgmock-dev libspdlog-dev

      - name: Compile and test.
        run: make test CXX=g++-14

